<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Puff the felt cloud</title>
<style>html,body{margin:0;background:#1b1714;color:#eee;font:13px system-ui} canvas{display:block;max-width:100vw}</style>
</head>
<body>
<canvas id="out"></canvas>
<script src="src/timeline.js"></script>
<script src="src/shaders.js"></script>
<script>
// cloud.html: renders one frame of the video at time t. window.renderAt(t, opts) → data URL.
// Each frame averages `samples` sub-frames spread across a 180° shutter, each with its own sub-pixel jitter
// (motion blur and anti-aliasing at once), into a float buffer; the post pass tone-maps, adds grain, and the
// final 2D canvas applies the 21st Blur Dissolve in and out of warm haze.
const glc = document.createElement('canvas');
const gl = glc.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true, premultipliedAlpha: false });
const floatOK = !!gl.getExtension('EXT_color_buffer_float');
const out = document.getElementById('out'), ctx = out.getContext('2d');

function compile(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function program(fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, QUAD_VS)); gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.bindAttribLocation(p, 0, 'aPos'); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const name = gl.getActiveUniform(p, i).name.replace(/\[0\]$/, ''); u[name] = gl.getUniformLocation(p, name); }
  return { p, u };
}
const scene = program(SCENE_FS), post = program(POST_FS);
const vbo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

let fbo = null, tex = null, size = [0, 0];
function resize(w, h) {
  if (size[0] === w && size[1] === h) return;
  size = [w, h]; glc.width = out.width = w; glc.height = out.height = h;
  if (tex) { gl.deleteTexture(tex); gl.deleteFramebuffer(fbo); }
  tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, floatOK ? gl.RGBA16F : gl.RGBA8, w, h, 0, gl.RGBA, floatOK ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  fbo = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
}
const flat = rows => rows.flat();
function setScene(S, w, h, jitter, weight, lookdev = false) {
  const u = scene.u;
  gl.uniform1f(u.uLookdev, lookdev ? 1 : 0);
  gl.uniform2f(u.uRes, w, h); gl.uniform2f(u.uJitter, jitter[0], jitter[1]); gl.uniform1f(u.uWeight, weight);
  gl.uniform3fv(u.uCamPos, S.cam.pos); gl.uniform3fv(u.uCamFwd, S.cam.fwd); gl.uniform3fv(u.uCamRight, S.cam.right); gl.uniform3fv(u.uCamUp, S.cam.up);
  gl.uniform1f(u.uFocal, S.focal);
  gl.uniform3fv(u.uCloudPos, S.cloud.pos); gl.uniformMatrix3fv(u.uCloudRot, true, flat(S.cloud.rot));
  gl.uniform3fv(u.uCloudScale, S.cloud.scale);
  gl.uniform1f(u.uMinScale, Math.min(...S.cloud.scale)); gl.uniform1f(u.uMaxScale, Math.max(...S.cloud.scale)); gl.uniform1f(u.uTwist, S.cloud.twist);
  gl.uniform3fv(u.uBodyC, S.body.c); gl.uniform3fv(u.uBodyR, S.body.r); gl.uniform4fv(u.uLobe, flat(S.lobes)); gl.uniform1f(u.uK, S.k);
  gl.uniform3fv(u.uEyeP, flat(S.eyes.map(e => e.p))); gl.uniformMatrix3fv(u.uEyeB, true, flat(S.eyes.map(e => flat(e.basis))));
  gl.uniform3fv(u.uEyeR, flat(S.eyes.map(e => e.r))); gl.uniform1f(u.uEyeCurve, S.eyeCurve);
  gl.uniform1f(u.uFloorY, S.floorY); gl.uniform1f(u.uGlow, S.glow); gl.uniform1f(u.uDrift, S.drift); gl.uniform1f(u.uSunSwell, S.sunSwell);
  gl.uniform2fv(u.uSweep, S.sweep);
  const sc = w / 1920; gl.uniform4f(u.uSpark, S.spark[0] * sc, S.spark[1] * sc, S.spark[2] * sc, S.spark[3]);
}
// R2 low-discrepancy sequence for sub-pixel jitter
const r2 = i => [((i + 1) * 0.7548776662) % 1 - .5, ((i + 1) * 0.5698402910) % 1 - .5];

window.renderAt = (t, o = {}) => {
  const w = o.w || 1920, h = Math.round(w * 9 / 16), K = o.samples || 4, shutter = o.shutter ?? 0.5;
  resize(w, h);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo); gl.viewport(0, 0, w, h);
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  gl.useProgram(scene.p);
  let S0 = null;
  for (let i = 0; i < K; i++) {
    const ts = K > 1 ? t + ((i + .5) / K - .5) * shutter / (o.fps || FPS) : t;
    const S = Object.assign({}, stateAt(Math.max(0, Math.min(DUR, ts))));
    if (o.lookdev) { S.cam = lookAt([0.08, 0.02, 5.9], [0.08, -0.06, 0], 0); S.focal = o.focal || 2.45; }
    if (i === Math.floor(K / 2) || !S0) S0 = S;
    setScene(S, w, h, K > 1 ? r2(i) : [0, 0], 1 / K, !!o.lookdev);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  gl.disable(gl.BLEND);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, w, h);
  gl.useProgram(post.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex); gl.uniform1i(post.u.uAcc, 0);
  gl.uniform2f(post.u.uRes, w, h); gl.uniform1f(post.u.uSeed, (t * 977.3) % 113); gl.uniform1f(post.u.uGrain, o.grain ?? 0.022);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  // final composite: blur dissolve from/to warm haze
  const P = o.lookdev ? { vis: 1, blur: 0, scale: 1 } : stateAt(t).post, sc = w / 1920;
  ctx.save(); ctx.fillStyle = o.lookdev ? '#000' : 'rgb(255,226,187)'; ctx.fillRect(0, 0, w, h);
  ctx.globalAlpha = P.vis; ctx.filter = P.blur > .05 ? `blur(${(P.blur * sc).toFixed(2)}px)` : 'none';
  ctx.translate(w / 2, h / 2); ctx.scale(P.scale, P.scale); ctx.translate(-w / 2, -h / 2);
  ctx.drawImage(glc, 0, 0); ctx.restore();
  return out.toDataURL(o.mime || 'image/png', o.quality || .95);
};
window.stateAt = stateAt;
window.info = () => ({ floatOK, renderer: gl.getParameter(gl.RENDERER), version: gl.getParameter(gl.VERSION) });
// in a normal browser, play it in real time: ?t=3.2 holds a frame, ?w=960 sets the size
const qs = new URLSearchParams(location.search);
if (!qs.has('render')) {
  const w = +(qs.get('w') || 960), start = performance.now();
  const tick = () => { const t = qs.has('t') ? +qs.get('t') : ((performance.now() - start) / 1000) % DUR; renderAt(t, { w, samples: 1 }); if (!qs.has('t')) requestAnimationFrame(tick); };
  tick();
}
window.ready = true;
</script>
</body>
</html>
